version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: satellite
      POSTGRES_USER: satellite
      POSTGRES_PASSWORD: satellite
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: development
      OFFLINE_MODE: 'true'
      DATABASE_URL: sqlite:///./data/satellite.db
      MODEL_DIR: /app/models
      DATA_DIR: /app/data
      INDEX_DIR: /app/indexes
    volumes:
      - ./backend:/app
    ports:
      - '8000:8000'
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    depends_on:
      - backend

volumes:
  pgdata:
